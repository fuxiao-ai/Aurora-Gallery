name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm run rebuild-native

      - name: Check source
        run: npm run lint

      - name: Check version
        run: npm run version-check

      - name: Run regression tests
        run: npm test

      - name: Download cloudflared
        run: npm run download-cloudflared

      # 随包内置 AI 模型（人脸 YuNet + w600k_mbf、搜图 SigLIP2 文本 + 视觉，约 400 MB）。
      # 这一步要联网从 InsightFace Release 与 Hugging Face 拉模型；失败不让流水线变红：
      # afterPack 找不到 models/ 时只是退回旧行为（用户首次使用时在设置里下载模型）。
      - name: Bundle AI models
        continue-on-error: true
        run: npm run bundle-models

      - name: Build
        run: npm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/*.yml
          if-no-files-found: ignore

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/*.yml
          generate_release_notes: false
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
