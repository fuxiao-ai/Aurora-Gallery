          <button onclick="changeCardSizeTo(180)" data-size="180">L</button>
          <button onclick="changeCardSizeTo(320)" data-size="320">XL</button>
        </div>
      </div>
      <div class="sheet-row">
        <label>媒体类型</label>
        <div class="sheet-buttons" id="mediaFilterButtons">
          <button onclick="changeMediaFilter('all')" data-filter="all">全部</button>
          <button onclick="changeMediaFilter('image')" data-filter="image">图片</button>
          <button onclick="changeMediaFilter('video')" data-filter="video">视频</button>
        </div>
      </div>
      <div class="sheet-row">
        <label for="mobileSortSelect">排序方式</label>
        <select id="mobileSortSelect" onchange="changeSort(this.value)">
          <option value="date_taken|DESC">最新拍摄</option>
          <option value="date_taken|ASC">最早拍摄</option>
          <option value="file_name|ASC">文件名 A-Z</option>
          <option value="file_name|DESC">文件名 Z-A</option>
          <option value="file_size|DESC">体积从大到小</option>
          <option value="file_size|ASC">体积从小到大</option>
        </select>
      </div>
      <div class="sheet-row">
        <label for="mobilePageSizeSelect">每页数量</label>
        <select id="mobilePageSizeSelect" onchange="changePageSize(this.value)">
          <option value="50" selected>50 张/页</option>
          <option value="80">80 张/页</option>
          <option value="100">100 张/页</option>
          <option value="200">200 张/页</option>
        </select>
      </div>
      <div class="sheet-actions">
        <button type="button" onclick="closeMobileFilterSheet()">关闭</button>
      </div>
      <button
        type="button"
        class="sheet-settings-link"
        onclick="closeMobileFilterSheet(); openWebSettingsPage();"
      >
        更多设置（外观 · 快捷键 · 存储 · 网络）
      </button>
    </div>

    <!-- Preview -->
    <div class="preview-overlay" id="previewOverlay">
      <div class="preview-slideshow-controls">
        <button id="slideshowToggleBtn" onclick="toggleSlideshow()">
          <svg class="icon" aria-hidden="true"><use href="#icon-play" /></svg> 播放
        </button>
        <select id="slideshowIntervalSelect">
          <option value="2">2 秒</option>
          <option value="3" selected>3 秒</option>
          <option value="5">5 秒</option>
          <option value="10">10 秒</option>
        </select>
        <button id="slideshowRandomBtn" onclick="toggleSlideshowRandom()" title="幻灯片随机顺序">
          随机:关
        </button>
        <button id="previewSubtitleToggleBtn" onclick="toggleSubtitleEnabled()">字幕:开</button>
        <button id="previewFullscreenBtn" onclick="togglePreviewFullscreen()">全屏</button>
        <button
          id="previewFavoriteBtn"
          class="preview-action-btn"
          title="收藏"
          onclick="
            (function () {
              var p = state.previewPhotos && state.previewPhotos[state.previewIndex];
              if (p) toggleFavoriteForPhoto(p.id);
            })()
          "
        >
          <svg class="icon" aria-hidden="true"><use href="#icon-heart" /></svg>
        </button>
      </div>
      <div class="preview-window-controls">
        <button
          class="preview-info-toggle"
          id="previewInfoToggle"
          onclick="togglePreviewInfoPanel()"
          title="照片信息"
          aria-label="照片信息"
        >
          <svg class="icon" aria-hidden="true"><use href="#icon-info" /></svg>
        </button>
        <button class="preview-close" onclick="closePreview()" aria-label="关闭预览">
          <svg class="icon" aria-hidden="true"><use href="#icon-close" /></svg>
        </button>
      </div>
      <div class="preview-swipe-hint" id="previewSwipeHint">左右滑动切换</div>
      <div class="preview-body">
        <button
          class="preview-nav preview-prev"
          onclick="navigatePreview(-1, event)"
          aria-label="上一张"
        >
          <svg class="icon" aria-hidden="true"><use href="#icon-chevron-left" /></svg>
        </button>
        <div class="preview-loading" id="previewLoading">
          <span class="spinner" aria-hidden="true"></span>
          <span>加载中...</span>
        </div>
        <img class="preview-img" id="previewImage" src="" alt="预览图片" />
        <video
          class="preview-video"
          id="previewVideo"
          controls
          playsinline
          preload="metadata"
          style="display: none"
        ></video>
        <button
          class="preview-video-center-play"
          id="previewVideoCenterPlay"
          type="button"
          aria-label="播放视频"
          title="播放"
          style="display: none"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
        </button>
        <button
          class="preview-nav preview-next"
          onclick="navigatePreview(1, event)"
          aria-label="下一张"
        >
          <svg class="icon" aria-hidden="true"><use href="#icon-chevron-right" /></svg>
        </button>
      </div>
      <div class="preview-info-panel" id="previewInfoPanel">
        <div class="preview-info-panel-header">
          <h3>照片信息</h3>
          <button
            class="preview-info-panel-close"
            onclick="togglePreviewInfoPanel()"
            aria-label="关闭"
          >
            <svg class="icon"><use href="#icon-close" /></svg>
          </button>
        </div>
        <div id="previewInfoPanelContent">
          <div class="preview-info-empty">打开照片后查看信息</div>
        </div>
      </div>
      <div class="preview-zoom-box" id="previewZoomBox">
        <div class="preview-zoom-tooltip" role="tooltip">
          Ctrl（Mac：⌘）+ 滚轮缩放<br />键盘 + / − 缩放 · 触摸屏双指据合缩放
        </div>
        <div class="preview-zoom" id="previewZoom" tabindex="0">100%</div>
      </div>
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="contextMenu" role="menu" aria-hidden="true">
      <div class="context-menu-item" data-action="preview" role="menuitem">
        <svg class="icon" aria-hidden="true"><use href="#icon-photos" /></svg>
        <span>预览</span>
      </div>
      <div class="context-menu-item" data-action="favorite" role="menuitem">
        <svg class="icon" aria-hidden="true"><use href="#icon-heart" /></svg>
        <span>收藏</span>
      </div>
      <div class="context-menu-item" data-action="download" role="menuitem">
        <svg class="icon" aria-hidden="true"><use href="#icon-download" /></svg>
        <span>下载</span>
      </div>
      <div class="context-menu-item" data-action="info" role="menuitem">
        <svg class="icon" aria-hidden="true"><use href="#icon-info" /></svg>
        <span>照片信息</span>
      </div>
      <div class="context-menu-divider"></div>
      <div class="context-menu-item" data-action="select" role="menuitem">
        <svg class="icon" aria-hidden="true"><use href="#icon-check" /></svg>
        <span>选择</span>
      </div>
    </div>

    <!-- Selection Toolbar -->
    <div class="selection-toolbar" id="selectionToolbar" aria-hidden="true">
      <div class="selection-toolbar-inner">
        <span class="selection-count" id="selectionCount">已选 0 张</span>
        <button class="selection-btn" onclick="selectAllPhotos()" title="全选">
          <svg class="icon" aria-hidden="true"><use href="#icon-check" /></svg> 全选
        </button>
        <button class="selection-btn" onclick="deselectAllPhotos()" title="取消">
          <svg class="icon" aria-hidden="true"><use href="#icon-close" /></svg> 取消
        </button>
        <button
          class="selection-btn selection-btn-accent"
          onclick="downloadSelected()"
          title="下载"
        >
          <svg class="icon" aria-hidden="true"><use href="#icon-download" /></svg> 下载
        </button>
        <button
          class="selection-btn selection-btn-accent"
          onclick="favoriteSelected()"
          title="收藏"
        >
          <svg class="icon" aria-hidden="true"><use href="#icon-heart" /></svg> 收藏
        </button>
      </div>
    </div>

    <!-- Back to Top -->
    <button
      class="back-to-top"
      id="backToTop"
      onclick="scrollToTop()"
      title="回到顶部"
      aria-label="回到顶部"
    >
      <svg class="icon" aria-hidden="true"><use href="#icon-chevron-up" /></svg>
    </button>

    <div class="web-toast" id="webToast"></div>

    <!-- 移动端搜索弹窗 -->
    <div class="search-overlay" id="searchOverlay" onclick="closeSearchOverlay()">
      <div class="search-overlay-inner" onclick="event.stopPropagation()">
        <div class="search-overlay-input-wrap">
          <span class="search-overlay-icon"
            ><svg class="icon" aria-hidden="true"><use href="#icon-search" /></svg
          ></span>
          <input
            type="text"
            id="searchOverlayInput"
            placeholder="搜索照片（回车）"
            aria-label="搜索照片"
          />
          <button class="search-overlay-close" onclick="closeSearchOverlay()" aria-label="关闭">
            <svg class="icon" aria-hidden="true"><use href="#icon-close" /></svg>
          </button>
        </div>
        <p class="search-overlay-hint">输入关键词后按回车搜索</p>
      </div>
    </div>

    <!-- 设置页：与桌面端同一套 7 面板信息架构，网页端只读镜像 + 少量本地偏好。
         面板骨架与内容全部由 js/settings-page.js 渲染（这里只留一个挂载点）。 -->
    <div class="web-settings" id="webSettingsPage" hidden></div>

    <script src="/hls-attach.js"></script>
    <script src="/playback-strategy.js"></script>
    <script src="/js/web-theme-shared.js?v=9"></script>
    <link rel="stylesheet" href="/photo-compare.css?v=1" />
    <script src="/js/photo-compare.js?v=1"></script>
    <!-- 照片信息面板的字段注册表：与桌面端共用同一份，网页端只读桌面端勾好的字段集 -->
    <script src="/js/photo-info-fields.js?v=1"></script>
    <!-- 搜图 / 人物的入口在文件栏，结果落进主照片网格，不再需要独立弹窗样式 -->
    <link rel="stylesheet" href="/ai-web-views.css?v=1" />
    <link rel="stylesheet" href="/settings-page.css?v=1" />
    <script src="/js/ai-views.js?v=1"></script>
    <script src="/js/app.js?v=4"></script>
    <!-- 必须排在 app.js 之后：它要调用 app.js 挂到 window 上的换主题 / 换每页数量等入口 -->
    <script src="/js/settings-page.js?v=1"></script>
  </body>
</html>
